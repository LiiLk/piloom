name: Release PiLoom

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing production release tag to publish or retry (e.g., v0.0.1)'
        required: true
        type: string

concurrency:
  group: release-piloom
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  release-context:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      beta_version: ${{ steps.context.outputs.beta_version }}
      build_commit: ${{ steps.context.outputs.build_commit }}
      build_ref: ${{ steps.context.outputs.build_ref }}
      production_version: ${{ steps.context.outputs.production_version }}
      publish_beta: ${{ steps.context.outputs.publish_beta }}
      publish_production: ${{ steps.context.outputs.publish_production }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve release context
        id: context
        env:
          BEFORE_SHA: ${{ github.event.before || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          INPUT_RELEASE_TAG: ${{ github.event.inputs.release_tag || '' }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          beta_version=
          build_ref=
          production_version=
          publish_beta=false
          publish_production=false

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
              echo "Manual releases must run from the default branch (${DEFAULT_BRANCH}), not ${REF_NAME}." >&2
              exit 1
            fi
            production_version="${INPUT_RELEASE_TAG#v}"
            build_ref="v${production_version}"
            publish_production=true
          elif [ "$REF_TYPE" = tag ]; then
            production_version="${REF_NAME#v}"
            build_ref="$REF_NAME"
            publish_production=true
          else
            production_version=$(node -p "require('./package.json').version")
            build_ref="$GITHUB_SHA_VALUE"
            beta_version="${production_version}-beta.${RUN_NUMBER}.${RUN_ATTEMPT}.${GITHUB_SHA_VALUE::7}"
            publish_beta=true

            previous_version=
            if [ -n "$BEFORE_SHA" ] && ! printf '%s\n' "$BEFORE_SHA" | grep -Eq '^0+$' && git cat-file -e "${BEFORE_SHA}:package.json"; then
              git show "${BEFORE_SHA}:package.json" > /tmp/previous-package.json
              previous_version=$(node -p "require('/tmp/previous-package.json').version")
            fi

            if [ -z "$previous_version" ] || [ "$production_version" != "$previous_version" ]; then
              if git show-ref --verify --quiet "refs/tags/v${production_version}"; then
                tagged_commit=$(git rev-list -n 1 "v${production_version}")
                if [ "$tagged_commit" != "$GITHUB_SHA_VALUE" ]; then
                  echo "Production v${production_version} already points to ${tagged_commit}, not ${GITHUB_SHA_VALUE}." >&2
                  exit 1
                fi
                echo "Retrying production v${production_version} for ${GITHUB_SHA_VALUE}."
                publish_production=true
              else
                echo "Production v${production_version} is waiting for its immutable tag; publishing beta only."
              fi
            elif ! git show-ref --verify --quiet "refs/tags/v${production_version}"; then
              echo "Production v${production_version} has no tag; publishing beta only."
            else
              echo "Package version is unchanged at ${production_version}; only beta will advance."
            fi
          fi

          if [ "$publish_production" = true ] && ! printf '%s\n' "$production_version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Production version must be plain semver like 0.0.1: ${production_version}" >&2
            exit 1
          fi

          if [ "$publish_production" = true ]; then
            release_tag="v${production_version}"
            if ! git show-ref --verify --quiet "refs/tags/${release_tag}"; then
              echo "Production releases require an existing immutable tag: ${release_tag}" >&2
              exit 1
            fi
            tagged_commit=$(git rev-list -n 1 "$release_tag")
            build_commit=$(git rev-parse "${build_ref}^{commit}")
            if [ "$tagged_commit" != "$build_commit" ]; then
              echo "${release_tag} points to ${tagged_commit}, not requested build ${build_commit}." >&2
              exit 1
            fi
            if ! git merge-base --is-ancestor "$tagged_commit" "origin/${DEFAULT_BRANCH}"; then
              echo "${release_tag} does not point to a commit reachable from ${DEFAULT_BRANCH}." >&2
              exit 1
            fi
            tagged_package_version=$(git show "${tagged_commit}:package.json" | node -e 'let value=""; process.stdin.on("data", chunk => value += chunk); process.stdin.on("end", () => console.log(JSON.parse(value).version));')
            if [ "$tagged_package_version" != "$production_version" ]; then
              echo "${release_tag} does not match package.json version ${tagged_package_version}." >&2
              exit 1
            fi
            build_ref="$release_tag"
          fi

          build_commit=$(git rev-parse "${build_ref}^{commit}")
          echo "beta_version=$beta_version" >> "$GITHUB_OUTPUT"
          echo "build_commit=$build_commit" >> "$GITHUB_OUTPUT"
          echo "build_ref=$build_ref" >> "$GITHUB_OUTPUT"
          echo "production_version=$production_version" >> "$GITHUB_OUTPUT"
          echo "publish_beta=$publish_beta" >> "$GITHUB_OUTPUT"
          echo "publish_production=$publish_production" >> "$GITHUB_OUTPUT"
          echo "Build ref: $build_ref"
          echo "Build commit: $build_commit"
          echo "Production: $publish_production ${production_version:+v${production_version}}"
          echo "Beta: $publish_beta ${beta_version:+v${beta_version}}"

  build:
    runs-on: ubuntu-latest
    needs: release-context
    permissions:
      contents: read
    env:
      BETA_VERSION: ${{ needs.release-context.outputs.beta_version }}
      BUILD_REF: ${{ needs.release-context.outputs.build_ref }}
      PRODUCTION_VERSION: ${{ needs.release-context.outputs.production_version }}
      PUBLISH_BETA: ${{ needs.release-context.outputs.publish_beta }}
      PUBLISH_PRODUCTION: ${{ needs.release-context.outputs.publish_production }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Pack production release
        if: env.PUBLISH_PRODUCTION == 'true'
        run: |
          npm run release:pack -- \
            --channel stable \
            --version "$PRODUCTION_VERSION" \
            --out-dir packages/coding-agent/release/production

      - name: Pack beta release
        if: env.PUBLISH_BETA == 'true'
        run: |
          npm run release:pack -- \
            --channel beta \
            --version "$BETA_VERSION" \
            --out-dir packages/coding-agent/release/beta

      - name: Upload production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prime-agent-production
          path: packages/coding-agent/release/production/artifacts/*
          if-no-files-found: error

      - name: Upload beta artifacts
        if: env.PUBLISH_BETA == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prime-agent-beta
          path: packages/coding-agent/release/beta/artifacts/*
          if-no-files-found: error

  windows-verify:
    name: Verify Windows package
    runs-on: windows-latest
    needs: release-context
    permissions:
      contents: read
    env:
      BUILD_REF: ${{ needs.release-context.outputs.build_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm.cmd ci

      - name: Build
        run: npm.cmd run build

      - name: Install uv
        run: |
          python -m pip install uv
          uv --version

      - name: Check
        run: npm.cmd run check

      - name: Test built extension loading
        working-directory: packages/coding-agent
        run: |
          npx.cmd tsx ../../node_modules/vitest/dist/cli.js --run test/resource-loader.test.ts test/extensions-discovery.test.ts test/extensions-runner.test.ts test/daemon-extension-binding.test.ts test/project-trust-settings.test.ts test/trust-manager.test.ts

      - name: Test kernel and lifecycle paths
        working-directory: packages/coding-agent
        run: |
          npm.cmd run test:kernel
          npx.cmd tsx ../../node_modules/vitest/dist/cli.js --run test/kernel-startup.test.ts test/owned-session-worker-process.test.ts test/package-self-update-daemon.test.ts
      - name: Test Windows portability paths
        if: always()
        working-directory: packages/coding-agent
        run: |
          npx.cmd tsx ../../node_modules/vitest/dist/cli.js --run test/daemon-socket.test.ts test/daemon-launch.test.ts test/daemon-command.test.ts test/daemon-windows-auth.test.ts test/windows-job-object.test.ts test/piloom-command.test.ts test/exec.test.ts test/daemon-ps.test.ts test/child-process.test.ts test/shell.test.ts test/session-lease.test.ts test/tools-manager.test.ts test/auth-storage.test.ts test/telemetry.test.ts test/refinement.test.ts test/session-manager-flush.test.ts test/tools.test.ts
          npx.cmd tsx ../../node_modules/vitest/dist/cli.js --run --no-file-parallelism test/daemon-supervisor-process.test.ts
          npx.cmd tsx ../../node_modules/vitest/dist/cli.js --run test/daemon-supervisor-process.test.ts --testNamePattern "isolates a root, streams a chunked snapshot, and adopts the same worker after restart" --tagsFilter process-stress
          npx.cmd tsx ../../node_modules/vitest/dist/cli.js --run test/package-manager.test.ts --testNamePattern "quotes Windows-shell"

  windows-binary:
    name: Build Windows binary
    runs-on: windows-latest
    needs: release-context
    permissions:
      contents: read
    env:
      BETA_VERSION: ${{ needs.release-context.outputs.beta_version }}
      BUILD_REF: ${{ needs.release-context.outputs.build_ref }}
      PRODUCTION_VERSION: ${{ needs.release-context.outputs.production_version }}
      PUBLISH_BETA: ${{ needs.release-context.outputs.publish_beta }}
      PUBLISH_PRODUCTION: ${{ needs.release-context.outputs.publish_production }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.12'

      - name: Install dependencies
        run: npm.cmd ci

      - name: Build and smoke-test production Windows binary
        if: env.PUBLISH_PRODUCTION == 'true'
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/build-windows-binary.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE\windows-release" -Version "$env:PRODUCTION_VERSION"

      - name: Build and smoke-test beta Windows binary
        if: env.PUBLISH_BETA == 'true'
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/build-windows-binary.ps1 -OutputDirectory "$env:GITHUB_WORKSPACE\windows-release" -Version "$env:BETA_VERSION"

      - name: Upload Windows binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: piloom-windows-x64
          path: windows-release/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [release-context, build, windows-verify, windows-binary]
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write
    env:
      BETA_VERSION: ${{ needs.release-context.outputs.beta_version }}
      BUILD_COMMIT: ${{ needs.release-context.outputs.build_commit }}
      BUILD_REF: ${{ needs.release-context.outputs.build_ref }}
      PRODUCTION_VERSION: ${{ needs.release-context.outputs.production_version }}
      PUBLISH_BETA: ${{ needs.release-context.outputs.publish_beta }}
      PUBLISH_PRODUCTION: ${{ needs.release-context.outputs.publish_production }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BUILD_REF }}
          persist-credentials: false

      - name: Download production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prime-agent-production
          path: release-artifacts/production

      - name: Download beta artifacts
        if: env.PUBLISH_BETA == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: prime-agent-beta
          path: release-artifacts/beta

      - name: Download Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: piloom-windows-x64
          path: release-artifacts/windows

      - name: Sign release checksums
        env:
          PILOOM_RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.PILOOM_RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$PILOOM_RELEASE_SIGNING_PRIVATE_KEY"
          if [ "$PUBLISH_PRODUCTION" = true ]; then
            node scripts/sign-release-checksums.mjs --channel stable --version "$PRODUCTION_VERSION" \
              "release-artifacts/production/SHA256SUMS" \
              "release-artifacts/windows/piloom-${PRODUCTION_VERSION}-windows-x64.zip.sha256"
          fi
          if [ "$PUBLISH_BETA" = true ]; then
            node scripts/sign-release-checksums.mjs --channel beta --version "$BETA_VERSION" \
              "release-artifacts/beta/SHA256SUMS" \
              "release-artifacts/windows/piloom-${BETA_VERSION}-windows-x64.zip.sha256"
          fi

      - name: Prepare installer
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const installer = fs.readFileSync("install.sh", "utf8");
          const powershellInstaller = fs.readFileSync("install.ps1", "utf8");
          const renderInstaller = (channel) => installer
            .replaceAll("__PRIME_AGENT_DEFAULT_RELEASE_CHANNEL__", channel);
          const renderPowerShellInstaller = (channel) => powershellInstaller
            .replaceAll("__PRIME_AGENT_DEFAULT_RELEASE_CHANNEL__", channel);
          fs.mkdirSync("release-artifacts/installers", { recursive: true });
          fs.writeFileSync("release-artifacts/installers/install.sh", renderInstaller("stable"));
          fs.writeFileSync("release-artifacts/installers/install-beta.sh", renderInstaller("beta"));
          fs.writeFileSync("release-artifacts/installers/install.ps1", renderPowerShellInstaller("stable"));
          fs.writeFileSync("release-artifacts/installers/install-beta.ps1", renderPowerShellInstaller("beta"));
          NODE

      - name: Attest production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-artifacts/production/*.tgz
            release-artifacts/windows/piloom-${{ needs.release-context.outputs.production_version }}-windows-x64.zip
            release-artifacts/installers/install.sh
            release-artifacts/installers/install.ps1

      - name: Attest beta artifacts
        if: env.PUBLISH_BETA == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-artifacts/beta/*.tgz
            release-artifacts/windows/piloom-${{ needs.release-context.outputs.beta_version }}-windows-x64.zip
            release-artifacts/installers/install-beta.sh
            release-artifacts/installers/install-beta.ps1

      - name: Extract production release notes
        if: env.PUBLISH_PRODUCTION == 'true'
        run: |
          awk "/^## \[${PRODUCTION_VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" packages/coding-agent/CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "Release v${PRODUCTION_VERSION}" > /tmp/release-notes.md
          fi

      - name: Preflight immutable production artifacts
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRODUCTION_DIR=release-artifacts/production
          RELEASE_TAG="v${PRODUCTION_VERSION}"
          release_assets=(
            "$PRODUCTION_DIR"/*
            "release-artifacts/windows/piloom-${PRODUCTION_VERSION}-windows-x64.zip"
            "release-artifacts/windows/piloom-${PRODUCTION_VERSION}-windows-x64.zip.sha256"
            "release-artifacts/windows/piloom-${PRODUCTION_VERSION}-windows-x64.zip.sha256.sig"
            "release-artifacts/installers/install.sh"
            "release-artifacts/installers/install.ps1"
          )

          for artifact in "${release_assets[@]}"; do
            test -f "$artifact"
          done

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            for artifact in "${release_assets[@]}"; do
              asset_name=$(basename "$artifact")
              if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq ".assets[] | select(.name == \"${asset_name}\") | .id" | grep -q .; then
                existing_dir=$(mktemp -d)
                gh release download "$RELEASE_TAG" --pattern "$asset_name" --dir "$existing_dir"
                if ! cmp -s "$artifact" "$existing_dir/$asset_name"; then
                  rm -rf "$existing_dir"
                  echo "Refusing to replace immutable GitHub release asset with different bytes: ${asset_name}" >&2
                  exit 1
                fi
                rm -rf "$existing_dir"
              fi
            done
          fi

      - name: Create production GitHub release
        if: env.PUBLISH_PRODUCTION == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="v${PRODUCTION_VERSION}"
          PRODUCTION_DIR=release-artifacts/production
          release_assets=(
            "$PRODUCTION_DIR"/*
            "release-artifacts/windows/piloom-${PRODUCTION_VERSION}-windows-x64.zip"
            "release-artifacts/windows/piloom-${PRODUCTION_VERSION}-windows-x64.zip.sha256"
            "release-artifacts/windows/piloom-${PRODUCTION_VERSION}-windows-x64.zip.sha256.sig"
            "release-artifacts/installers/install.sh"
            "release-artifacts/installers/install.ps1"
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            for asset in "${release_assets[@]}"; do
              asset_name=$(basename "$asset")
              if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq ".assets[] | select(.name == \"${asset_name}\") | .id" | grep -q .; then
                existing_dir=$(mktemp -d)
                gh release download "$RELEASE_TAG" --pattern "$asset_name" --dir "$existing_dir"
                if ! cmp -s "$asset" "$existing_dir/$asset_name"; then
                  rm -rf "$existing_dir"
                  echo "Refusing to replace immutable GitHub release asset with different bytes: ${asset_name}" >&2
                  exit 1
                fi
                rm -rf "$existing_dir"
              else
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file /tmp/release-notes.md \
              "${release_assets[@]}"
          fi

      - name: Advance beta release
        if: env.PUBLISH_BETA == 'true'
        env:
          BETA_DIR: release-artifacts/beta
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER_DIR: release-artifacts/installers
          WINDOWS_DIR: release-artifacts/windows
        run: |
          latest_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${DEFAULT_BRANCH}" --jq .sha)
          if [ "$latest_main_sha" != "$BUILD_COMMIT" ]; then
            echo "A newer main commit exists; keeping its beta pointers in place."
            exit 0
          fi
          printf 'Automated beta build from `%s` (`%s`).\n' "$DEFAULT_BRANCH" "$BUILD_COMMIT" > /tmp/beta-release-notes.md
          bash scripts/publish-beta-release.sh

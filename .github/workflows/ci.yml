name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-check:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

  build-check-windows:
    name: Build and check (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm.cmd ci

      - name: Build
        run: npm.cmd run build

      - name: Check
        run: npm.cmd run check

  install-smoke:
    name: Global install smoke (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
            npm: npm
          - name: Windows
            runner: windows-latest
            npm: npm.cmd
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: ${{ matrix.npm }} ci

      - name: Build
        run: ${{ matrix.npm }} run build

      # Packs the release tarball and installs it with `npm install --global`,
      # the only layout that nests dependencies under the installed package.
      - name: Install the release tarball globally
        run: ${{ matrix.npm }} run check:global-install

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent-core
            package: packages/agent
            command: npm test
            install_uv: false
          - name: ai
            package: packages/ai
            command: npm test
            install_uv: false
          - name: tui
            package: packages/tui
            command: npm test
            install_uv: false
          - name: coding-agent 1/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=1/3
            install_uv: true
          - name: coding-agent 2/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=2/3
            install_uv: true
          - name: coding-agent 3/3
            package: packages/coding-agent
            command: npm run test:ci -- --shard=3/3
            install_uv: true
          - name: coding-agent process smoke
            package: packages/coding-agent
            command: npm run test:process
            install_uv: true
          - name: coding-agent kernel
            package: packages/coding-agent
            command: npm run test:kernel
            install_uv: true
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s $(which fdfind) /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install uv
        if: matrix.install_uv
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Test
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.command }}

  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm.cmd ci

      - name: Build
        run: npm.cmd run build

      - name: Install uv
        run: |
          python -m pip install uv
          uv --version

      - name: Test kernel and lifecycle paths
        working-directory: packages/coding-agent
        run: |
          npm.cmd run test:kernel
          npx.cmd tsx ../../node_modules/vitest/dist/cli.js --run test/kernel-startup.test.ts test/owned-session-worker-process.test.ts test/package-self-update-daemon.test.ts
      - name: Test Windows portability paths
        working-directory: packages/coding-agent
        run: |
          npx.cmd tsx ../../node_modules/vitest/dist/cli.js --run test/daemon-socket.test.ts test/daemon-launch.test.ts test/daemon-command.test.ts test/daemon-windows-auth.test.ts test/windows-job-object.test.ts test/piloom-command.test.ts test/exec.test.ts test/daemon-ps.test.ts test/child-process.test.ts test/shell.test.ts test/session-lease.test.ts test/tools-manager.test.ts test/auth-storage.test.ts test/telemetry.test.ts test/refinement.test.ts test/session-manager-flush.test.ts test/tools.test.ts
          npx.cmd tsx ../../node_modules/vitest/dist/cli.js --run --no-file-parallelism test/daemon-supervisor-process.test.ts
          npx.cmd tsx ../../node_modules/vitest/dist/cli.js --run test/daemon-supervisor-process.test.ts --testNamePattern "isolates a root, streams a chunked snapshot, and adopts the same worker after restart" --tagsFilter process-stress
          npx.cmd tsx ../../node_modules/vitest/dist/cli.js --run test/package-manager.test.ts --testNamePattern "quotes Windows-shell"

  build-check-test:
    name: build-check-test
    if: always()
    needs: [build-check, build-check-windows, install-smoke, test, test-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI results
        env:
          BUILD_CHECK_RESULT: ${{ needs.build-check.result }}
          BUILD_CHECK_WINDOWS_RESULT: ${{ needs.build-check-windows.result }}
          INSTALL_SMOKE_RESULT: ${{ needs.install-smoke.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_WINDOWS_RESULT: ${{ needs.test-windows.result }}
        run: |
          test "$BUILD_CHECK_RESULT" = success
          test "$BUILD_CHECK_WINDOWS_RESULT" = success
          test "$INSTALL_SMOKE_RESULT" = success
          test "$TEST_RESULT" = success
          test "$TEST_WINDOWS_RESULT" = success
